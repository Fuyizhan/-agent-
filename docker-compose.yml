services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: contract_review
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Shanghai
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d contract_review"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./python
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/contract_review
      SEED_ON_STARTUP: "true"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-only-jwt-secret-change-before-production-64-characters}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      CONTRACT_LLM_API_KEY: ${CONTRACT_LLM_API_KEY:-}
      CONTRACT_LLM_BASE_URL: ${CONTRACT_LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CONTRACT_LLM_MODEL: ${CONTRACT_LLM_MODEL:-qwen-max}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      MINIMAX_API_BASE: ${MINIMAX_API_BASE:-https://api.minimax.chat/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M2.7}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-20}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; r=httpx.get('http://localhost:8000/api/v1/health'); assert r.status_code == 200"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads_data:
